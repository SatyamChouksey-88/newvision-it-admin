# NewVision on Render
# Dashboard → New → Blueprint → connect this repo → apply.
# First-boot login: superadmin@newvision.local / Password123!
# Then change that password. Seed runs once via initialDeployHook (not on every restart).

databases:
  - name: newvision-db
    databaseName: newvision
    user: newvision
    postgresMajorVersion: '16'
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []

services:
  - type: web
    name: newvision-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    initialDeployHook: npm run seed
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: newvision-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: SEED_ON_START
        value: 'false'
      - key: CORS_ORIGIN
        fromService:
          name: newvision-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_APP_URL
        fromService:
          name: newvision-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: HELPDESK_MAILBOX
        sync: false

  - type: web
    name: newvision-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    buildFilter:
      paths:
        - frontend/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: VITE_API_URL
        fromService:
          name: newvision-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

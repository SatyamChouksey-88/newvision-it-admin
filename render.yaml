# NewVision on Render
# Dashboard → New → Blueprint → connect this repo → apply.
# First-boot: set BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD (12+ chars).
# Temporarily: demo accounts (@newvision.local / Password123!) are allowed on live.
# Bootstrap seed is paused in backend/prisma/seed.ts (function kept, not deleted).
#
# Hosting region: Singapore — demo only. India region (Mumbai/Hyderabad) on request.
# Do not recreate the Postgres instance to "move" region; that drops data.
# API uses Starter (always-on). Postgres plan is left as-is so an apply does not
# rebuild the database.

databases:
  - name: newvision-db
    databaseName: newvision
    user: newvision
    postgresMajorVersion: '16'
    region: singapore
    plan: free
    ipAllowList: []

services:
  - type: web
    name: newvision-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    initialDeployHook: npm run seed
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: newvision-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: ALLOW_DEMO_LOGINS
        value: 'true'
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: SEED_ON_START
        value: 'true'
      - key: SEED_IF_EMPTY
        value: 'true'
      # Temporarily paused — keep bootstrap env keys for later, do not delete.
      # - key: SEED_MODE
      #   value: bootstrap
      # - key: BOOTSTRAP_ADMIN_EMAIL
      #   sync: false
      # - key: BOOTSTRAP_ADMIN_PASSWORD
      #   sync: false
      # - key: BOOTSTRAP_ADMIN_NAME
      #   sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CORS_ORIGIN
        fromService:
          name: newvision-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_APP_URL
        fromService:
          name: newvision-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: HELPDESK_MAILBOX
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: IMAP_PORT
        value: '993'
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASS
        sync: false
      - key: IMAP_MAILBOX
        value: INBOX
      - key: EMAIL_INGEST_SECRET
        sync: false
      - key: HOSTING_REGION
        value: singapore
      # Temporarily off so demo Super Admin can sign in without TOTP.
      - key: REQUIRE_SUPERADMIN_MFA
        value: 'false'
      # - key: REQUIRE_SUPERADMIN_MFA
      #   value: 'true'
      - key: PLATFORM_ADMIN_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  - type: web
    name: newvision-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - frontend/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: VITE_API_URL
        fromService:
          name: newvision-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
